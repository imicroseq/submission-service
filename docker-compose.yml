services:
  postgres:
    container_name: submission.postgres
    image: postgres:15-alpine
    ports:
      - 5432:5432
    volumes:
      - vs_submission_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=postgres
      - POSTGRES_DB=lyric
  lectern_mongo:
    container_name: submission.lectern.db
    image: mongo:8.3.17
    ports:
      - 27017:27017
    volumes:
      - vs_mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
  lectern_service:
    container_name: submission.lectern.service
    image: ghcr.io/overture-stack/lectern:2.0.0
    ports:
      - 3000:3000
    environment:
      MONGO_HOST: lectern_mongo
      MONGO_PORT: 27017
      MONGO_DB: admin
      MONGO_USER: admin
      MONGO_PASS: password
volumes:
  vs_mongodb_data:
    driver: local
  vs_submission_data:
    driver: local
